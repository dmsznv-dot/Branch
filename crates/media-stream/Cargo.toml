[package]
name = "media-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
getrandom = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
room-server = { path = "../room-server" }
shared-protocol = { path = "../shared-protocol" }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "macros", "rt", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

sync-engine = { path = "../sync-engine" }

[dev-dependencies]
sync-engine = { path = "../sync-engine", features = ["test-support"] }
