[package]
name = "media-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libmpv2-sys = { version = "=4.0.1", optional = true }
media-stream = { path = "../media-stream" }
shared-protocol = { path = "../shared-protocol" }
tokio = { version = "1.54.0", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
native-mpv = ["dep:libmpv2-sys"]

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "media-probe"
path = "src/bin/media-probe.rs"
required-features = ["native-mpv"]
