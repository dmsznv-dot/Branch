[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]

[lib]
name = "desktop"

[[bin]]
name = "desktop"
path = "src/main.rs"
required-features = ["native-host"]

[features]
default = ["native-host"]
ipc-test = ["native-host", "tauri/test"]
custom-protocol = ["native-host", "tauri/custom-protocol"]
native-host = ["dep:tauri", "dep:tauri-build", "dep:rfd", "media-engine/native-mpv"]

[dependencies]
media-engine = { path = "../../../crates/media-engine" }
shared-protocol = { path = "../../../crates/shared-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri = { version = "=2.12.4", optional = true, features = ["unstable", "macos-private-api"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
